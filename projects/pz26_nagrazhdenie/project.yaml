     in: [02_concept/ideas.md, 01_research/strategy.md, brands/pz_premiya/brand.yaml], out: [02_concept/concept.md], status: todo, from: creative-director}
  - {id: t006, role: copywriter, task: "сценарий (4 части, 7 категорий по 5 лауреатов, финал) и текст диктора; фразы лауреатов - конкретная деталь, без штампов п.4.4(9); по идее 1 Заготовка, с вариантами под 2 и 3",
