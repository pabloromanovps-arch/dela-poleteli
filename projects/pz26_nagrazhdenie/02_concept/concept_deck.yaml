# Презентация концепта «Путеводная звезда 2026» — ВНУТРЕННЯЯ версия для владельца агентства.
# Клиенту не уходит без одобрения владельца (qc-supervisor + creative-director).
# Сборка (из корня репозитория):
#   python tools/deck/build_deck.py projects/pz26_nagrazhdenie/02_concept/concept_deck.yaml --brand pz_premiya --out projects/pz26_nagrazhdenie/02_concept/concept_deck.pptx --pdf --preview
title: "Путеводная звезда 2026 · концепт"
footer: "Дела полетели · Путеводная звезда 2026 · Концепт v1 · внутренняя версия"
brand: pz_premiya
slides:
  - type: cover
    kicker: "Направление A «Заготовка» · внутренняя версия"
    title: "Ключ, который\nделают люди"
    notes: "Внутренняя версия для владельца. Клиенту — только после одобрения владельца, qc-supervisor и creative-director."

  - type: statement
    kicker: "Задача"
    title: "35 лауреатов — не 35 интервью"
    notes: "Шесть с половиной минут, три экрана и потолок: из списка людей сделать одно высказывание. Хронометраж 390 с — допущение, клиент не называл. 35 = 7 категорий x 5; спецноминации не учтены."

  - type: statement
    kicker: "Инсайт · ключ передают из рук в руки"
    title: "Лауреат узнаёт себя не в титре, а в жесте рук"

  - type: compare
    kicker: "Направления"
    title: "Три пути, рекомендуем A"
    options:
      - {name: "A · Заготовка", recommended: true, points: ["Ключ растёт зубцами", "Счёт 01–35 на экране"]}
      - {name: "B · Эстафета", points: ["Склейка по передаче", "Нужна съёмка рук"]}
      - {name: "C · Семь ключей", points: ["Морф ключа в ключ", "Нет сквозного счёта"]}

  - type: text
    kicker: "A · Механика"
    title: "Каждый лауреат добавляет один зубец"
    body:
      - "Ключ начинается без бородки"
      - "Зубец с номером — на каждого"
      - "Семь слесарных операций — по категориям"

  - type: text
    kicker: "A · Три экрана"
    title: "Три экрана — три роли"
    body:
      - "Центр: рез зубца, затем кадр лауреата"
      - "Боковая карточка: имя, компания, номинация"
      - "Счётчик зубцов 01–35"

  - type: text
    kicker: "A · Потолок и финал"
    title: "Потолок приносит ключ, финал открывает зал"
    body:
      - "Потолок: заготовка спускается на экран"
      - "Вступление: двери — лишь на щель"
      - "«Зал победителей»: двери открыты, портреты"

  - type: palette
    kicker: "Палитра · золото 6,8:1 — заголовки не набираем"
    title: "Латунь к финалу становится золотом бренда"
    colors:
      - {name: "Фон #002935", hex: "#002935", share: 70}
      - {name: "Осн. #0B3139", hex: "#0B3139", share: 15}
      - {name: "Лат. #8A6B3A", hex: "#8A6B3A"}
      - {name: "Зол. #C9A961", hex: "#C9A961", share: 10}
      - {name: "Срез #F2E3B3", hex: "#F2E3B3"}
      - {name: "Служ #A8BFBC", hex: "#A8BFBC"}
      - {name: "Текст #F4EFE4", hex: "#F4EFE4", share: 5}
    notes: "Лат. #8A6B3A (3,0:1) — только материал объекта, текст не набирается. Зол. #C9A961 (6,8:1) — номера и линии; заголовки и имена — тёплым белым #F4EFE4 (13,4:1)."

  - type: typography
    kicker: "Типографика · требования, гарнитуры выберет владелец (fonthound)"
    levels:
      - {name: "Имена", size: 40, font: "Inter Display", bold: true, sample: "Антиква гравёрного характера"}
      - {name: "Служ #A8BFBC", size: 24, font: "Inter", sample: "Нейтральный гротеск, цифры табличные"}
      - {name: "Правило", size: 18, font: "Inter", sample: "Кириллица родная · штрих от 4 px · имя до 3 строк"}
    notes: "Шрифты на слайде — временные (Inter, SIL OFL), только для теста сборки. Выбор — за владельцем через fonthound, с проверкой лицензии и кириллицы (ё, й, №, «», —)."

  - type: text
    kicker: "A · Язык движения и ритм"
    title: "Ритм задаёт щелчок металла"
    body:
      - "100 BPM, зубец режется на сильной доле"
      - "Лауреату — по 5 с, всем поровну"
      - "Структура 390 с: семь блоков по 31 с"

  - type: image
    image: ../06_build/rnd/key_test.png
    caption: "Тест реализуемости: ключ строится из таблицы лауреатов, не стайлфрейм"

  - type: text
    kicker: "Производство"
    title: "Ключ и карточки строятся из таблицы"
    body:
      - "Blender — ключ, After Effects — три экрана"
      - "Лица и текст не рисует нейросеть"
      - "Реальные материалы лауреатов встают в готовые слоты"

  - type: timeline
    kicker: "Сценарий"
    title: "390 секунд в пяти частях"
    steps:
      - {when: "0:00 · потолок", what: "Заготовка спускается на экран"}
      - {when: "0:20 · вступление", what: "Двери приоткрываются на щель"}
      - {when: "0:50 · блоки", what: "Семь категорий по пять лауреатов"}
      - {when: "4:27 · переход", what: "Ключ готов, пауза зала"}
      - {when: "5:07 · финал", what: "Двери открыты, 35 портретов"}

  - type: text
    kicker: "Что нужно решить"
    title: "Пять решений до стайлфреймов"
    body:
      - "Отступление: двери приоткрываются на щель"
      - "Короткие формулы фраз лауреатов"
      - "Короткие названия компаний для карточек"
      - "Число спецноминаций"
      - "Экраны и потолок: данные площадки"

  - type: end
    title: "Утверждаем A и берём стайлфреймы"
    contact: "Дальше: стайлфреймы 7680×1536 и выбор шрифтов"
