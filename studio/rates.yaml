# Ставки агентства. Источник: приложение владельца «Смета PRO» (офлайн-калькулятор,
# московские ставки за смену, без НДС/налога). Смета берёт цифры ТОЛЬКО отсюда.
# null — ставки в «Смете PRO» нет: спросить владельца, не придумывать.
source: "Смета PRO (A1BCB582B0_PRO.html), раздел WIZ_SPECIALISTS + RATES"
currency: RUB

# Наценки — как в «Смете PRO»:
# Строка = Кол-во × Смен × Цена × Коэф.
# Раздел = Σ строк (+ наценка раздела)
# Прямые → + Непредвиденные % → + Комиссия % (от прямые+непредвиденные) → ПОДИТОГ
#        → − Скидка % → + Налог % (gross-up: ИТОГ = подитог / (1 − налог)) → ИТОГ
markup:
  contingency_pct: 3
  commission_pct: 15
  commission_base: subtotal     # subtotal = прямые + непредвиденные; direct = только прямые
  tax_pct: 7
  tax_mode: gross               # gross = гросс-ап, add = сверху, extract = выделить
  discount_pct: 0
revision_rounds_included: 2

# Ставка за смену по ролям агентства.
# Роли с пометкой «≈0,76 ×» — средний рынок Москвы (окт. 2026): месячная зарплата из
# открытых источников × коэффициент 0,76 — так соотносятся ставки «Сметы PRO»
# с рынком (моушн 95к/130к, 2D 70к/90к, 3D 110к/140к). Это оценка, а не прайс.
day_rate:
  motion-designer: 95000          # «Моушн-дизайнер (смена)»
  designer: 70000                 # «2D-дизайнер (подготовка слоёв и графики)»
  cg-generalist: 110000           # «3D-дизайнер / 3D-визуализация»
  editor: 90000                   # «Режиссёр монтажа»
  account-manager: 115000          # ≈0,76 × 150 тыс./мес; рынок: ГородРабот 156 тыс., медиана 150 тыс. Часто покрывается комиссией, отдельной строкой — по решению владельца
  producer: 85000          # ≈0,76 × 110 тыс./мес; рынок: ГородРабот 109,5 тыс. (широкая категория «продюсер»)
  strategist: 135000          # ≈0,76 × 175 тыс./мес; данных нет — по аналогии с арт-директором
  creative-director: null         # в «Смете PRO» только за проект — см. per_project
  art-director: 135000          # ≈0,76 × 175 тыс./мес; рынок: 150–200 тыс. (ГородРабот, Hireseeker, Позитив Стафф)
  copywriter: null                # за проект — см. per_project
  concept-artist: 105000          # ≈0,76 × 140 тыс./мес; данных нет — по аналогии с 3D-художником
  storyboard-artist: 85000          # ≈0,76 × 110 тыс./мес; данных нет — между 2D-дизайнером и моушн-дизайнером
  compositor: 100000          # ≈0,76 × 130 тыс./мес; рынок: Compositing Artist от 120 тыс. (hh.ru)
  colorist: null                  # за проект
  sound-designer: null            # за проект; на площадке — см. onsite
  technical-director: 150000          # ≈0,76 × 200 тыс./мес; данных по VFX TD нет; общий техдиректор Москва медиана 261 тыс. — взято ниже
  qc-supervisor: null             # есть позиция «за файл» — см. per_unit

# Позиции за проект (вилка: разные типы проектов в «Смете PRO»)
per_project:
  creative_director: [90000, 120000]
  script: [90000, 180000]                 # сценарий (сценарист)
  edit_full: [160000, 240000]             # монтаж (сборка фильма)
  edit_rough_archive: 90000               # черновой монтаж из архива
  edit_final_archive: 140000              # чистовой монтаж
  motion_graphics_titles: [80000, 110000] # моушн-графика, титры
  color_grading: [70000, 85000]
  sound_design_mix: [90000, 95000]
  voiceover_record_mix: 45000
  music_licensing: 60000
  format_adaptations: 65000
  archive_restore_upscale: 60000
  festival_materials_subtitles: 40000

per_unit:
  delivery_file_qc: 18000                 # сдача файлов под сетки (контроль качества), за файл
  render_hour: 2500                       # рендер-ферма, за час

# Площадка и трансляции, за смену
onsite:
  broadcast_director: 120000
  media_server_operator: 60000
  led_engineer: 75000
  content_supervisor: 45000
  test_run: 35000
  sound_engineer_onsite: [55000, 60000]

# Съёмочная группа (если проект со съёмкой), за смену
shoot:
  director: [120000, 240000]
  dop: [140000, 280000]
  second_camera: [110000, 120000]
  production_designer: [90000, 95000]
  script_supervisor: 30000
  host: 150000
  casting_project: [70000, 90000]
